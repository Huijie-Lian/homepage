#          pageRef: /
#          weight: 10
        - identifier: publications
          name: Publications
          pageRef: /pubs/
          weight: 40
    #    - identifier: teaching
    #      name: Teaching
    #      pageRef: /teaching/
    #      weight: 50
        - identifier: about
          name: About
          pageRef: /about/
          weight: 60






