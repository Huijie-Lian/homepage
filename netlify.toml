[build]
publish = "public"
command = "cd academic-site && npm ci && hugo --gc --minify --destination ../public"

[build.environment]
HUGO_VERSION = "0.166.0"
NODE_VERSION = "22"
HUGO_ENV = "production"
TZ = "Asia/Shanghai"

[context.deploy-preview]
command = "cd academic-site && npm ci && hugo --gc --minify --destination ../public --buildFuture -b $DEPLOY_PRIME_URL"

[context.branch-deploy]
command = "cd academic-site && npm ci && hugo --gc --minify --destination ../public -b $DEPLOY_PRIME_URL"
